name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The ruff and ty hooks are `uv run --no-sync`, so the venv must exist before prek runs.
      # There is no .python-version, so name the newest Python in the matrix rather than
      # take whatever the runner image ships.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
          # Distinguishes this job's cache key from py3.14 in check-matrix. Without it both
          # race on the same key and one fails to save.
          cache-suffix: lint
      - run: uv sync --locked
      # Runs the hooks from .pre-commit-config.yaml rather than repeating them here, so local
      # and CI cannot drift. commitlint is a commit-msg hook and pytest a pre-push one, so
      # --all-files skips both; the Conventional Commits job and check-matrix cover them.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204  # v3.0.1
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.5
        with:
          prek-version: ${{ env.PREK_VERSION }}

  check-matrix:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
        with:
          version: 3.x
      - run: uv sync
      - run: task dev:check

  check:
    name: Lint, typecheck, test
    # The ruleset requires this name, so lint rolls up here rather than as a new required check.
    needs: [lint, check-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lint.result != 'success' || needs.check-matrix.result != 'success'
        run: exit 1

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action: upstream is unmaintained and pins
      # @commitlint/ensure ^19, which predates the exemption for long lines
      # containing a URL added in v20. Dependabot bodies are markdown link lists
      # well over 100 chars, so ^19 fails them on body-max-line-length while the
      # pre-commit hook (v21) passes them.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.1
        with:
          configFile: commitlint.config.mjs

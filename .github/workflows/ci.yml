name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-matrix:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The supported range, matching requires-python, not a pin: widen it by hand when
        # a Python is added to or dropped from support.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
        env:
          # setup-task adds the v itself, so the value is the bare version.
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          TASK_VERSION: 3.54.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: uv sync
      - run: task dev:check

  check:
    name: Lint, typecheck, test
    needs: check-matrix
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - if: needs.check-matrix.result != 'success'
        run: exit 1

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action: upstream is unmaintained and pins
      # @commitlint/ensure ^19, which predates the exemption for long lines
      # containing a URL added in v20. Dependabot bodies are markdown link lists
      # well over 100 chars, so ^19 fails them on body-max-line-length while the
      # pre-commit hook (v21) passes them.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.1
        with:
          configFile: commitlint.config.mjs

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The zizmor hook from .pre-commit-config.yaml, so its rev is the one zizmor pin. The
      # token lets zizmor run its online audits (impostor commits, known-vulnerable actions);
      # without one it skips them and still passes.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: zizmor --all-files
